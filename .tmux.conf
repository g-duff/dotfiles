# Vim keybindings
setw -g mode-keys vi

# Set better prefix
unbind C-b
set-option -g prefix C-Space
bind C-Space send-prefix


# make colors inside tmux look the same as outside of tmux
set-option -ga terminal-overrides ",xterm-256color:Tc"


# --- replaces tmux-sensible ---
set -g escape-time 0
set -g history-limit 50000
set -g focus-events on
set -g aggressive-resize on
set -sg repeat-time 600
set -g status-interval 5


# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1


# Vim style pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Catppuccin Mocha palette — canonical hex values:
# https://catppuccin.com/palette
# https://github.com/catppuccin/palette/blob/main/palette.json

set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left ""
set -g status-left-length 0

set -g status-right "#[fg=#181825,bg=#89b4fa] %Y-%m-%d %H:%M "
set -g status-right-length 50

setw -g window-status-format "#[fg=#6c7086,bg=#1e1e2e] #I:#W "
setw -g window-status-current-format "#[fg=#1e1e2e,bg=#cba6f7,bold] #I:#W "

set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

set -g message-style "bg=#89b4fa,fg=#1e1e2e"
